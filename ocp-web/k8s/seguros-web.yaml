# seguros-web en OpenShift (namespace seguros-ibmi).
# Imagen construida en el clúster:  oc new-build --binary --strategy=docker --name=seguros-web -n seguros-ibmi
#                                   oc start-build seguros-web --from-dir=ocp-web --follow -n seguros-ibmi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seguros-web
  namespace: seguros-ibmi
  labels:
    app: seguros-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seguros-web
  template:
    metadata:
      labels:
        app: seguros-web
    spec:
      containers:
        - name: seguros-web
          image: image-registry.openshift-image-registry.svc:5000/seguros-ibmi/seguros-web:latest
          ports:
            - containerPort: 8080
          env:
            - name: IBMI_API_URL
              value: http://10.1.3.125:8090
            - name: INSTANA_AGENT_HOST          # agente de Instana del nodo (DaemonSet)
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: seguros-web
  namespace: seguros-ibmi
  labels:
    app: seguros-web
spec:
  selector:
    app: seguros-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: seguros-web
  namespace: seguros-ibmi
  labels:
    app: seguros-web
spec:
  to:
    kind: Service
    name: seguros-web
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
